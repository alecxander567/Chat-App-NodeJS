<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat</title>
    
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

    <div class="background-container"></div> 
    <!-- Sidebar for User Profile -->
    <div class="container mt-5">
        <!-- Flexbox container to center the title and keep the button on the left -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <!-- Toggle Button for Sidebar -->
            <button class="btn btn-primary" onclick="toggleSidebar()">☰ Profile</button>
    
        </div>
    </div>
    

    <!-- Chat App Content -->
    <div id="sidebar" class="sidebar">
        <h4>User Profile</h4>
        <p><strong>Name:</strong> <span id="profile-name">Anonymous</span></p>
        <p><strong>Status:</strong> Online</p>
        <button class="btn btn-danger w-100" onclick="toggleSidebar()">Close</button>
    </div>
    

        <div class="chat-container mt-3" style="padding: 10px;">
            <div id="chat-box" class="p-3 rounded"></div>
            <div class="message sent">
            <div class="input-group mt-3">
                <input id="message" type="text" class="form-control" placeholder="Type a message...">
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS + Socket.io -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
    <script src="design.js"></script>
</body>
</html>
